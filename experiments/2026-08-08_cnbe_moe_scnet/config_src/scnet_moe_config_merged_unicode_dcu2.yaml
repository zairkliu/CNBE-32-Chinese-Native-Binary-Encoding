experiment_name: cnbe-unicode-merged-dense-dcu2
seed: 42
device: cuda

data:
  max_train_tokens: 516000000
  max_eval_tokens: 27000000

model:
  d_model: 1024
  d_ff: 2048
  n_layers: 12
  n_heads: 16
  num_experts: 1
  top_k: 1
  dropout: 0.1
  use_moe: false
  learned_router: false
  balance_weight: 0.0
  aux_loss_weight: 0.0

training:
  seq_len: 256
  batch_size: 8
  grad_accum_steps: 1
  epochs: 1
  steps: 1000
  lr: 0.0003
  warmup_steps: 100
  weight_decay: 0.01
  grad_clip: 1.0
  precision: bf16
  log_every_steps: 10
  checkpoint_every_steps: 1000
