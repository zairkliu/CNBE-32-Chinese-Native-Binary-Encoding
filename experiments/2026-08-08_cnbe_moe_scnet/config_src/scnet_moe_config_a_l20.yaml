experiment_name: cnbe-moe-128-scnet-l20
seed: 42
device: cuda

data:
  cnbe_paths:
    - /data/cnbe/zzjh_294.cnbe
    - /data/cnbe/luxun_18.cnbe
    - /data/cnbe/agatha.cnbe
    - /data/cnbe/csbook.cnbe
    - /data/cnbe/jinyong.cnbe
    - /data/cnbe/caixin.cnbe
    - /data/cnbe/sushi.cnbe
  max_train_tokens: 24000000
  max_eval_tokens: 1200000

model:
  d_model: 512
  d_ff: 2048
  n_layers: 8
  n_heads: 8
  num_experts: 128
  top_k: 2
  dropout: 0.1
  use_moe: true
  learned_router: false
  balance_weight: 0.01
  aux_loss_weight: 0.1

training:
  seq_len: 128
  batch_size: 8
  grad_accum_steps: 8
  epochs: 2
  steps: 1000
  lr: 0.0003
  warmup_steps: 100
  weight_decay: 0.01
  grad_clip: 1.0
  precision: bf16
  log_every_steps: 10
  checkpoint_every_steps: 100
