# DeepSeek-R1-Distill-Qwen-14B 古籍句读 QLoRA 配置
# 使用今日全部失败教训；14B 与 0.8B 架构不兼容，采用知识迁移而非权重复用
continue_from_existing: false
base_model: deepseek-ai/DeepSeek-R1-Distill-Qwen-14B
optional_adapter: null
data:
  train_jsonl: llm/data/train.jsonl
  eval_jsonl: llm/data/eval.jsonl
  format: plain_continuation   # 关闭推理模板，不用 chat/think
  prompt_prefix: "古籍句读：\n"
  prompt_suffix: "\n答案：\n"
knowledge_preservation:
  mix_cnbe_jsonl: C:/Users/zairk/cnbe-training1/data/cnbe_train.jsonl
  cnbe_mix_per_epoch: 10000
  cnbe_prompt_prefix: "CNBE-32：\n"
  cnbe_prompt_suffix: "\n答案：\n"
qlora:
  r: 16
  lora_alpha: 32
  lora_dropout: 0.05
  target_modules:
    - q_proj
    - k_proj
    - v_proj
    - o_proj
    - gate_proj
    - up_proj
    - down_proj
  load_in_4bit: true
  bnb_4bit_quant_type: nf4
  bnb_4bit_compute_dtype: bfloat16
training:
  max_length: 1024
  epochs: 4
  batch_size: 1
  grad_accum_steps: 8
  learning_rate: 5.0e-5
  lr_scheduler: cosine
  warmup_ratio: 0.03
  save_steps: 200
  eval_steps: 100
  logging_steps: 10
  max_steps: -1
  no_thinking: true
  gradient_checkpointing: true
  seed: 42
